services:
  reverse-proxy:
    image: nginx:1.27-alpine
    container_name: umg-reverse-proxy
    ports:
      - "8083:8083"
    volumes:
      - ./infra/docker/nginx-reverse-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - frontend
    depends_on:
      - umg-web
      - umg-api
    restart: unless-stopped

  umg-web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    container_name: umg-web
    networks:
      - frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      retries: 3

  umg-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: umg-api
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://umg:umg@postgres:5432/umg?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
      MEDIA_STORAGE_PATH: /data/media
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DBSMS_BASE_URL: ${DBSMS_BASE_URL:-http://dbsms-server}
      DBSMS_USERNAME: ${DBSMS_USERNAME:-admin}
      DBSMS_PASSWORD: ${DBSMS_PASSWORD:-change-me}
      UNOAPI_BASE_URL: ${UNOAPI_BASE_URL:-}
      UNOAPI_API_KEY: ${UNOAPI_API_KEY:-}
      GWMD_BASE_URL: ${GWMD_BASE_URL:-http://gwmd:3000}
      GWMD_USERNAME: ${GWMD_USERNAME:-umg}
      GWMD_PASSWORD: ${GWMD_PASSWORD:-change-me}
      GWMD_WEBHOOK_SECRET: ${GWMD_WEBHOOK_SECRET:-}
      DBSMS_WEBHOOK_SECRET: ${DBSMS_WEBHOOK_SECRET:-}
      SIGNAL_BASE_URL: ${SIGNAL_BASE_URL:-http://signal-cli:8080}
    volumes:
      - umg-media-data:/data/media
    networks:
      - frontend
      - backend
      - transports
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:4000/api/v1/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3

  umg-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    container_name: umg-worker
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://umg:umg@postgres:5432/umg?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MEDIA_STORAGE_PATH: /data/media
      DBSMS_BASE_URL: ${DBSMS_BASE_URL:-http://dbsms-server}
      DBSMS_USERNAME: ${DBSMS_USERNAME:-admin}
      DBSMS_PASSWORD: ${DBSMS_PASSWORD:-change-me}
      UNOAPI_BASE_URL: ${UNOAPI_BASE_URL:-}
      UNOAPI_API_KEY: ${UNOAPI_API_KEY:-}
      GWMD_BASE_URL: ${GWMD_BASE_URL:-http://gwmd:3000}
      GWMD_USERNAME: ${GWMD_USERNAME:-umg}
      GWMD_PASSWORD: ${GWMD_PASSWORD:-change-me}
      GWMD_WEBHOOK_SECRET: ${GWMD_WEBHOOK_SECRET:-}
      DBSMS_WEBHOOK_SECRET: ${DBSMS_WEBHOOK_SECRET:-}
      SIGNAL_BASE_URL: ${SIGNAL_BASE_URL:-http://signal-cli:8080}
    volumes:
      - umg-media-data:/data/media
    networks:
      - backend
      - transports
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: umg-postgres
    environment:
      POSTGRES_USER: umg
      POSTGRES_PASSWORD: umg
      POSTGRES_DB: umg
    volumes:
      - umg-postgres-data:/var/lib/postgresql/data
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umg -d umg"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: umg-redis
    command: redis-server --appendonly yes
    volumes:
      - umg-redis-data:/data
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ─────────────────── Transport sidecars (TZ §21/§23/§24) ──────────────
  # By default Compose brings up the in-memory stub image at
  # `infra/docker/Dockerfile.sidecar-stub`. Production deployments swap
  # these for the real vendor images:
  #   - bbernhard/signal-cli-rest-api (TZ §24 — Signal)
  #   - aldinokemal/go-whatsapp-web-multidevice (TZ §23 — WhatsApp, MIT)
  #   - clairton/unoapi-cloud (TZ §23 — WhatsApp, GPL-3.0, legacy)
  #   - DBLtek GoIP SMS Server v1.30.1 sidecar (TZ §21 — vendor archive,
  #     SHA-256-pinned locally, never committed).
  # Network `transports` is `internal: true` so the vendor containers
  # have no LAN/internet egress (TZ §21, ADR-002).

  dbsms-vendor:
    build:
      context: ./infra/docker
      dockerfile: Dockerfile.sidecar-stub
    container_name: umg-dbsms-vendor
    environment:
      STUB_VENDOR: dbsms
      STUB_PORT: "8080"
    networks:
      - transports
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5

  unoapi:
    build:
      context: ./infra/docker
      dockerfile: Dockerfile.sidecar-stub
    container_name: umg-unoapi
    environment:
      STUB_VENDOR: unoapi
      STUB_PORT: "9876"
    volumes:
      - umg-unoapi-data:/home/unoapi/data
    networks:
      - transports
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9876/ping >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5

  signal-cli:
    build:
      context: ./infra/docker
      dockerfile: Dockerfile.sidecar-stub
    container_name: umg-signal-cli
    environment:
      SIGNAL_CLI_MODE: ${SIGNAL_CLI_MODE:-json-rpc}
      STUB_VENDOR: signal
      STUB_PORT: "8080"
    volumes:
      - umg-signal-data:/home/signal/data
    networks:
      - transports
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/v1/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5

  gwmd:
    build:
      context: ./infra/docker
      dockerfile: Dockerfile.sidecar-stub
    container_name: umg-gwmd
    environment:
      STUB_VENDOR: gwmd
      STUB_PORT: "3000"
    volumes:
      - umg-gwmd-data:/home/gwmd/data
    networks:
      - transports
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5

networks:
  frontend:
    internal: false
  backend:
    internal: true
  transports:
    internal: true

volumes:
  umg-postgres-data:
  umg-redis-data:
  umg-media-data:
  # Persistent identity & session storage for transport sidecars.
  # signal-cli keeps linked-device keys here; without a volume a container
  # restart would force re-linking every Signal number (TZ §24).
  umg-signal-data:
  # UnoAPI keeps WhatsApp session creds here (TZ §23).
  umg-unoapi-data:
  # gwmd keeps WhatsApp whatsmeow session data here (TZ §23).
  umg-gwmd-data:
