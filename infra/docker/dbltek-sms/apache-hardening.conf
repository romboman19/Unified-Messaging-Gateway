# Loaded after the stock Debian config, so these win.

ServerTokens Prod
ServerSignature Off
TraceEnable Off

# Debian's default for /var/www is `Options Indexes FollowSymLinks`. Listings
# would expose every file the vendor ships; the symlink is how /goip resolves.
<Directory /var/www/>
    Options -Indexes +FollowSymLinks
    AllowOverride None
</Directory>
<Directory /usr/local/goip/>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

# Nothing but PHP pages and static assets is meant to be fetched. The archive
# ships its schema dumps (goipinit.sql, with the default admin account) and the
# goipcron binary inside the web root; config.inc.php is PHP and so executes
# to nothing, but its backups or editor copies would not.
<FilesMatch "(?i)(\.(sql|sh|log|bak|old|orig|save|swp|tmp|tar|gz|tgz|zip|ini|conf|cfg|inc|dist)|~)$">
    Require all denied
</FilesMatch>
<FilesMatch "^goipcron">
    Require all denied
</FilesMatch>

Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "SAMEORIGIN"
Header always set Referrer-Policy "no-referrer"
