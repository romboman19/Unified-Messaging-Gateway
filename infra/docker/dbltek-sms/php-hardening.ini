; Runtime limits for the vendor PHP. disable_functions is set by the entrypoint
; (SMS_PHP_DISABLE_FUNCTIONS) so it can be relaxed without rebuilding.
expose_php = Off
allow_url_include = Off
enable_dl = Off

session.cookie_httponly = 1
session.use_only_cookies = 1
session.use_strict_mode = 1
session.use_trans_sid = 0
