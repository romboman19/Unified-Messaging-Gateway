server {
  listen 8083;
  server_name _;

  # Docker's embedded DNS. Without an explicit resolver nginx looks its
  # upstreams up once, at startup, and bakes in the IPs. Two consequences, both
  # of which bit this stack repeatedly:
  #
  #   - if an upstream is not resolvable at that moment nginx exits with
  #     "host not found in upstream", so a proxy started before the API
  #     never comes up at all;
  #   - after any container is recreated its IP changes and the proxy keeps
  #     using the old one, serving 502 until someone restarts it by hand.
  #
  # Naming the resolver and putting the upstream in a variable defers the
  # lookup to request time, which fixes both.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /api/ {
    set $api_upstream http://umg-api:4000;
    proxy_pass $api_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Media uploads go through here; the API caps them at 50 MB itself.
    client_max_body_size 50m;
  }

  location / {
    set $web_upstream http://umg-web:80;
    proxy_pass $web_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
