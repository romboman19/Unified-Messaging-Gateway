# Production override — replaces dev stubs for signal-cli and whatsapp with
# the real vendor images (TZ §23/§24). The dbsms-vendor stub stays untouched:
# the real DBLtek GoIP sidecar is shipped as a vendor archive (TZ §21,
# ADR-003) and pinned out-of-band.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Persistent volumes `umg-signal-data` and `umg-gwmd-data` are reused so
# existing linked-device keys / WhatsApp session creds survive the switch.
#
# WhatsApp runs on one sidecar, `gwmd` (MIT), which drives the wizard's QR
# pairing flow. UnoAPI is parked — see the note on its service block below.
#
# TZ §1038 narrows UnoAPI: UnoAPI Cloud 2.x no longer returns QR codes via
# JSON HTTP — pairing is mediated by a socket.io WebSocket only. gwmd gives
# us a plain HTTP/JSON pairing flow that the wizard can drive end-to-end.

services:
  gwmd:
    build: !reset null
    # The publisher's Docker Hub namespace is `aldinokemal2104`; the bare
    # `aldinokemal/...` repository does not exist.
    image: aldinokemal2104/go-whatsapp-web-multidevice:latest
    container_name: umg-gwmd
    # `rest` is the subcommand the image's CMD supplies by default — it must
    # be repeated here, since `command:` replaces CMD wholesale.
    command:
      - "rest"
      # Released binaries call this `--base-path`; the flag was named
      # `--app-base-path` only on the development branch.
      - "--base-path=/app"
      - "--port=3000"
      # The bundled dashboard is fetched from GitHub at runtime. We never
      # use it and would rather not pull executable UI over the wire.
      - "--ui-enabled=false"
      - "--ui-auto-update=false"
      # Inbound messages have no other way in: WhatsApp gives us a webhook,
      # not a queue to poll. Without this the sidecar logs "Forwarding
      # message to 0 configured webhook(s)" and the message is simply lost.
      - "--webhook=http://umg-api:4000/api/v1/webhooks/gwmd"
      - "--webhook-secret=${GWMD_WEBHOOK_SECRET:?set in .env}"
      # Basic auth guards the REST surface; the gwmd adapter sends the same
      # credentials from `account.configJson`. Compose only interpolates
      # `${VAR}` — `$(VAR)` would be passed through as a literal.
      - "--basic-auth=${GWMD_USERNAME:-umg}:${GWMD_PASSWORD:?set in .env}"
    environment:
      TZ: Europe/Kyiv
    # `!override` replaces the base file's stub mount. Without it Compose
    # appends, leaving the same volume mounted at two different paths.
    volumes: !override
      # gwmd's WORKDIR is /app and it keeps the whatsmeow session DB under
      # `storages/` relative to it (config.PathStorages). Mounting anywhere
      # else means paired numbers are lost on every container recreate.
      - umg-gwmd-data:/app/storages
    networks:
      - transports
      # Signal and WhatsApp sidecars must reach their providers' servers:
      # signal-cli's `startLink` fails with "Link request error: Connection
      # closed!" without egress, and whatsmeow cannot open its socket. The
      # `transports` network stays internal so the GoIP vendor container
      # keeps its no-egress guarantee (ADR-002).
      - transports-egress
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # UnoAPI is parked, not deployed. gwmd is the WhatsApp sidecar (TZ §1038):
  # UnoAPI Cloud 2.x pairs over a socket.io WebSocket instead of returning a
  # QR over HTTP, so the wizard cannot drive it. Running the dev stub in
  # production would put a WhatsApp channel in the admin's Channels list that
  # can never actually pair — the profile keeps it out of `up` entirely.
  # To bring it back: write a real config (it is a Node/Redis service, not
  # Java/H2), drop the profile, and set UNOAPI_BASE_URL in .env so the API
  # seeds the account again.
  unoapi:
    profiles: ["parked"]

  signal-cli:
    build: !reset null
    image: bbernhard/signal-cli-rest-api:0.100
    container_name: umg-signal-cli
    environment:
      # signal-cli-rest-api runs in MODE=normal by default; json-rpc is
      # lower-latency for high-throughput send, and `startLink`/`finishLink`
      # (the linked-device handshake the wizard drives) are json-rpc calls.
      MODE: json-rpc
      # The sidecar logs `finishLink` failures — the step that completes a QR
      # pairing — at debug level only. Without this a half-linked account looks
      # identical to "the admin never scanned".
      LOG_LEVEL: ${SIGNAL_LOG_LEVEL:-debug}
    # `!override` replaces the base file's stub mount. Without it Compose
    # appends, leaving the same volume mounted at two different paths.
    volumes: !override
      # The image hardcodes SIGNAL_CLI_CONFIG_DIR=/home/.local/share/signal-cli.
      # Linked-device keys live here — mount the volume exactly there or every
      # restart forces re-pairing of every number (TZ §24).
      - umg-signal-data:/home/.local/share/signal-cli
    networks:
      - transports
      # Signal and WhatsApp sidecars must reach their providers' servers:
      # signal-cli's `startLink` fails with "Link request error: Connection
      # closed!" without egress, and whatsmeow cannot open its socket. The
      # `transports` network stays internal so the GoIP vendor container
      # keeps its no-egress guarantee (ADR-002).
      - transports-egress
    restart: unless-stopped
    healthcheck:
      # The image ships curl but not wget, and /v1/health answers 204.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/v1/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ─────────────── DBLtek GoIP SMS Server (TZ §21) ────────────────────
  # Replaces the dev stub with the real vendor application. Two processes
  # matter here: Apache serves the web UI and the JSON API that UMG calls,
  # and `goipcron` listens on udp/44444 — that is where the GoIP hardware
  # registers and delivers messages.
  #
  # Both ports are published to the host because the GSM gateway is a
  # physical box on the LAN: it dials *in* to this server using the IP,
  # Authentication ID and password configured per line on the gateway
  # itself. Those per-SIM credentials live on the hardware and in the SMS
  # Server's own "GoIP Manage" screen — UMG never sees them; it holds one
  # login to the SMS Server and addresses SIMs by line id (G101, G102…).
  dbsms-vendor:
    build: !reset null
    profiles: ["parked"]

  dbsms-db:
    image: mariadb:10.11
    container_name: umg-dbsms-db
    environment:
      MARIADB_ROOT_PASSWORD: ${SMS_DB_ROOT_PASSWORD:?set in .env}
      MARIADB_DATABASE: ${SMS_DB_NAME:-goip}
      MARIADB_USER: ${SMS_DB_USER:-goip}
      MARIADB_PASSWORD: ${SMS_DB_PASSWORD:?set in .env}
    volumes:
      - umg-dbsms-db-data:/var/lib/mysql
    networks:
      - transports
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root -p$$MARIADB_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  dbsms-server:
    build:
      context: ./infra/docker
      dockerfile: Dockerfile.dbltek-sms
    image: umg-dbltek-sms:local
    container_name: umg-dbsms-server
    environment:
      SMS_DB_HOST: dbsms-db
      SMS_DB_NAME: ${SMS_DB_NAME:-goip}
      SMS_DB_USER: ${SMS_DB_USER:-goip}
      SMS_DB_PASSWORD: ${SMS_DB_PASSWORD:?set in .env}
      # Only used once, to import the vendor dump: it creates the database and
      # its grants, which the application user cannot do.
      SMS_DB_ROOT_PASSWORD: ${SMS_DB_ROOT_PASSWORD:?set in .env}
      SMS_GOIPCRON_PORT: "44444"
      # The container builds its own forwarding URL from this; SMS_FORWARD_URL
      # stays available as an explicit override for unusual deployments.
      DBSMS_WEBHOOK_SECRET: ${DBSMS_WEBHOOK_SECRET:?set in .env}
      UMG_API_URL: ${UMG_API_URL:-http://umg-api:4000}
      SMS_FORWARD_URL: ${SMS_FORWARD_URL:-}
      TZ: Europe/Kyiv
    ports:
      # Vendor web UI — the admin adds the GoIP and its lines here.
      - "${SMS_WEB_PORT:-8084}:80"
      # The gateway registers here. Must stay 44444 unless the same port is
      # changed on every line of the hardware.
      - "44444:44444/udp"
    networks:
      # `transports` is how umg-api/worker reach the JSON API. `frontend` is
      # not for egress — a container attached only to an internal network
      # cannot have host ports published to it.
      - transports
      - frontend
    depends_on:
      dbsms-db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/goip/ >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  umg-dbsms-db-data:

networks:
  # Outbound-capable network for the sidecars that talk to Signal /
  # WhatsApp. Deliberately separate from `transports` so adding it is an
  # explicit, per-service decision rather than a blanket opening.
  transports-egress:
    internal: false
