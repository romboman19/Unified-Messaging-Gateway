name: SMS grouping
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  sms:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: umg_sms_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/umg_sms_test
      SMS_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/umg_sms_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run build --workspace=packages/contracts --workspace=packages/database --workspace=packages/channel-sdk --workspace=packages/adapters
      - run: npm run build --workspace=apps/api --workspace=apps/worker --workspace=apps/web
      - run: npx prisma migrate deploy --schema packages/database/prisma/schema.prisma
      - run: npm run test:sms
