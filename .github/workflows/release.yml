# Publishes a GitHub release for the version in package.json. Either push the
# tag yourself:
#   git tag v0.3.0 && git push origin v0.3.0
# or run this workflow by hand (Actions → release → Run workflow) on main, and
# it creates the tag on that commit. The notes are that version's section of
# CHANGELOG.md, so the changelog stays the single place release notes are
# written.
name: release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the tag
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg" >&2
            exit 1
          fi
          echo "TAG=$pkg" >> "$GITHUB_ENV"

      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            gh release create "$TAG" --title "UMG $TAG" --notes-file notes.md --verify-tag
          else
            # Creates the tag on the commit this run checked out.
            gh release create "$TAG" --title "UMG $TAG" --notes-file notes.md --target "$GITHUB_SHA"
          fi
